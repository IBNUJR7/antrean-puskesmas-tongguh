<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Display Antrean - UPT Puskesmas Tongguh</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col justify-between font-sans overflow-hidden">
    
    <!-- Banner Aktivasi Audio (Opsional jika browser memblokir suara otomatis) -->
    <div id="audio-banner" onclick="aktifkanAudio()" class="bg-amber-500 text-slate-950 px-4 py-2 text-center text-xs font-bold cursor-pointer hover:bg-amber-400 transition">
        🔊 Klik di sini untuk mengaktifkan suara Display TV
    </div>

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-8 flex justify-between items-center shadow-lg">
        <h1 class="text-2xl font-black text-emerald-400 tracking-wide">UPT PUSKESMAS TONGGUH</h1>
        <div id="clock" class="text-xl font-bold text-slate-300">00:00:00</div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 grid grid-cols-1 md:grid-cols-3 gap-6 p-6 h-[calc(100vh-120px)]">
        
        <!-- Kolom Kiri & Tengah: Nomor Sedang Dipanggil (Lebar 2 Kolom) -->
        <div class="md:col-span-2 bg-slate-800 border border-slate-700 rounded-3xl p-8 flex flex-col justify-center items-center text-center shadow-2xl">
            <h2 class="text-slate-400 font-bold text-2xl uppercase tracking-wider mb-4">Nomor Antrean Sedang Dipanggil</h2>
            <div id="nomor-tampil" class="text-9xl font-black text-yellow-400 my-4 tracking-wider">-</div>
            <div id="loket-tampil" class="text-2xl font-bold text-emerald-300 bg-slate-900/60 py-3 px-8 rounded-2xl border border-slate-700">
                Menunggu Panggilan
            </div>
        </div>

        <!-- Kolom Kanan: Daftar Antrean Menunggu -->
        <div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 flex flex-col shadow-2xl overflow-hidden">
            <h3 class="text-lg font-bold text-slate-300 border-b border-slate-700 pb-3 mb-4 flex justify-between items-center">
                <span>Daftar Antrean Menunggu</span>
            </h3>
            <div id="list-antrian" class="flex-1 overflow-y-auto space-y-3 pr-1">
                <p class="text-slate-500 text-center mt-20 text-base italic">Antrean kosong</p>
            </div>
        </div>

    </main>

    <script>
        function aktifkanAudio() {
            if ('speechSynthesis' in window) {
                let test = new SpeechSynthesisUtterance("");
                window.speechSynthesis.speak(test);
            }
            document.getElementById('audio-banner').style.display = 'none';
        }

        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('id-ID');
        }, 1000);

        // --- BAGIAN INI YANG DIPERBAIKI ---
        window.addEventListener('storage', (event) => {
            if (event.key === 'antrianData') {
                const data = JSON.parse(event.newValue);
                updateDisplay(data.aktif);
                updateList(data.list);
                
                if (data.triggerAudio && data.aktif && data.aktif.nomor !== '-') {
                    // Bunyikan suara dengan format tujuan Pendaftaran
                    playAudio(data.aktif.nomor, data.aktif.poli);
                    
                    // PENTING: Matikan triggerAudio agar tidak bunyi terus menerus saat HP nambah antrean
                    data.triggerAudio = false;
                    localStorage.setItem('antrianData', JSON.stringify(data));
                }
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            let dataAwal = JSON.parse(localStorage.getItem('antrianData'));
            if (dataAwal) {
                updateDisplay(dataAwal.aktif);
                updateList(dataAwal.list);
            }
        });

        function updateDisplay(aktif) {
            if (!aktif) return;
            document.getElementById('nomor-tampil').innerText = aktif.nomor;
            document.getElementById('loket-tampil').innerText = `Silakan Menuju Pendaftaran (${aktif.poli})`;
        }

        function updateList(list) {
            const container = document.getElementById('list-antrian');
            if (!list || list.length === 0) {
                container.innerHTML = `<p class="text-slate-500 text-center mt-20 text-base italic">Antrean kosong</p>`;
                return;
            }
            container.innerHTML = list.map(item => `
                <div class="bg-slate-700/50 p-3 rounded-xl flex justify-between items-center border border-slate-600 shadow-sm">
                    <span class="text-2xl font-bold text-emerald-300">${item.nomor}</span>
                    <span class="text-xs bg-slate-600 px-2.5 py-1 rounded-md text-slate-200 font-medium">${item.poli}</span>
                </div>
            `).join('');
        }

        // Suara Panggilan Otomatis (Format: Nomor -> Tujuan Pendaftaran -> Poli)
        function playAudio(nomor, poli) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Hentikan suara sebelumnya agar tidak tumpang tindih
                
                let nomorSpasi = nomor.split('').join(' ');
                const text = `Nomor antrean, ${nomorSpasi}, silakan menuju ke Pendaftaran, ${poli}`;
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'id-ID';
                utterance.rate = 0.85; 
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
