<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Ambil Antrean - UPT Puskesmas Tongguh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK v10 (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, get, set, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Konfigurasi Firebase Anda (Sesuaikan ID project Anda: antrean-puskesmas-e4bc8)
        const firebaseConfig = {
            databaseURL: "https://antrean-puskesmas-e4bc8-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Ekspor fungsi ke global agar bisa dipanggil tombol HTML
        window.prosesAmbil = async function() {
            const poliPilihan = document.getElementById('pilih-poli').value;
            const counterRef = ref(db, 'counterGlobal');
            const listRef = ref(db, 'listAntrean');

            try {
                // Gunakan Transaction agar nomor antrean aman dari bentrok real-time
                const result = await runTransaction(counterRef, (currentCount) => {
                    return (currentCount || 0) + 1;
                });

                if (result.committed) {
                    const num = result.snapshot.val();
                    const nomorBaru = `TGH-${String(num).padStart(3, '0')}`;
                    const waktuSekarang = new Date().toLocaleString('id-ID', { dateStyle: 'short', timeStyle: 'short' });

                    // Ambil data list yang ada lalu tambahkan yang baru
                    const snapshot = await get(listRef);
                    let listData = snapshot.val() || [];
                    listData.push({ nomor: nomorBaru, poli: poliPilihan, waktu: waktuSekarang });
                    
                    await set(listRef, listData);

                    // Isi Data ke Struk 4x6 cm
                    document.getElementById('print-nomor').innerText = nomorBaru;
                    document.getElementById('print-poli').innerText = poliPilihan;
                    document.getElementById('print-waktu').innerText = waktuSekarang;

                    // Jalankan Dialog Print Thermal
                    window.print();
                }
            } catch (error) {
                console.error("Gagal mengambil antrean:", error);
                alert("Terjadi kesalahan koneksi ke server database.");
            }
        };
    </script>
    <style>
        /* Pengaturan Khusus Ukuran Kertas Thermal Struk 4x6 cm */
        @media print {
            body * {
                visibility: hidden;
            }
            #print-area, #print-area * {
                visibility: visible;
            }
            #print-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 4cm;
                height: 6cm;
                padding: 2mm;
                box-sizing: border-box;
            }
            @page {
                size: 4cm 6cm;
                margin: 0;
            }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <!-- Interface Tombol Ambil Nomor -->
    <div class="bg-slate-800 rounded-2xl shadow-xl p-6 border border-slate-700 max-w-sm w-full space-y-5 text-center">
        <div>
            <h1 class="font-bold text-white text-lg">AMBIL NOMOR ANTREAN</h1>
            <p class="text-xs text-slate-400 mt-1">UPT Puskesmas Tongguh</p>
        </div>
        
        <!-- Dropdown Pilih Poli -->
        <div class="text-left">
            <label class="block text-xs font-bold text-slate-400 mb-1 uppercase tracking-wider">Pilih Poli Tujuan:</label>
            <select id="pilih-poli" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500 font-medium">
                <option value="Poli Umum">Poli Umum</option>
                <option value="Poli Gigi">Poli Gigi</option>
                <option value="KIA / KB">Poli KIA / KB</option>
                <option value="Lansia">Poli Lansia</option>
                <option value="UGD & Ranap">UGD & Ranap</option>
                <option value="Imunisasi">Imunisasi</option>
            </select>
        </div>

        <button onclick="prosesAmbil()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 px-6 rounded-xl shadow-lg transition text-base flex items-center justify-center space-x-2">
            <span>🎫 Cetak Karcis Antrean</span>
        </button>
    </div>

    <!-- Layout Struk Fisik Ukuran 4x6 cm (Khusus Printer) -->
    <div id="print-area" class="hidden print:block text-black font-mono text-center flex flex-col justify-between bg-white">
        <div>
            <div style="font-size: 9px; font-weight: bold; line-height: 1.1;">UPT PUSKESMAS TONGGUH</div>
            <div style="font-size: 7px;">Jalan Raya Aermata-Buduran</div>
            <div style="border-bottom: 1px dashed #000; margin: 3px 0;"></div>
            
            <div style="font-size: 8px; margin-top: 2px;">NOMOR ANTREAN</div>
            <div id="print-nomor" style="font-size: 30px; font-weight: 900; line-height: 1; margin: 2px 0;">TGH-001</div>
            <div id="print-poli" style="font-size: 9px; font-weight: bold; text-transform: uppercase; background: #eee; padding: 2px; border-radius: 2px;">POLI UMUM</div>
        </div>

        <div>
            <div style="border-bottom: 1px dashed #000; margin: 3px 0;"></div>
            <div id="print-waktu" style="font-size: 7px;">05/11/2026 14:00</div>
            <div style="font-size: 7px; margin-top: 1px;">Harap menunggu dipanggil</div>
        </div>
    </div>

</body>
</html>
