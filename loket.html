<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Loket Petugas - UPT Puskesmas Tongguh</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans p-6">

    <header class="max-w-4xl mx-auto bg-white p-6 rounded-2xl shadow mb-6 flex justify-between items-center border">
        <div>
            <h1 class="text-xl font-bold text-slate-800">Panel Loket Pendaftaran</h1>
            <p class="text-xs text-slate-500">UPT Puskesmas Tongguh</p>
        </div>
        <button onclick="resetAntrian()" class="bg-rose-100 hover:bg-rose-200 text-rose-700 text-xs font-bold px-4 py-2 rounded-xl transition">
            🔄 Reset Antrean Hari Ini
        </button>
    </header>

    <main class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-white p-6 rounded-2xl shadow border flex flex-col justify-between text-center">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Sedang Dipanggil</span>
            <div id="nomor-aktif" class="text-6xl font-black text-emerald-600 my-6">-</div>
            <div id="poli-aktif" class="text-sm font-bold text-slate-600 bg-slate-100 py-2 rounded-xl mb-6">-</div>
            
            <div class="space-y-3">
                <button onclick="panggilBerikutnya()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow transition cursor-pointer">
                    📢 Panggil Berikutnya
                </button>
                <button onclick="panggilUlang()" class="w-full bg-amber-500 hover:bg-amber-400 text-white font-bold py-3 rounded-xl shadow transition text-sm cursor-pointer">
                    🔔 Panggil Ulang
                </button>
            </div>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow border flex flex-col">
            <h2 class="text-sm font-bold text-slate-700 border-b pb-3 mb-4">Daftar Antrean Menunggu</h2>
            <div id="list-loket" class="flex-1 overflow-y-auto max-h-80 space-y-2 pr-1">
                <p class="text-xs text-slate-400 text-center py-8">Tidak ada antrean</p>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://antrean-puskesmas-e4bc8-default-rtdb.firebaseio.com",
            projectId: "antrean-puskesmas-e4bc8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentData = { aktif: { nomor: "-", poli: "-" }, list: [], triggerAudio: false };

        const antrianRef = ref(db, 'antrianData');
        onValue(antrianRef, (snapshot) => {
            currentData = snapshot.val() || { aktif: { nomor: "-", poli: "-" }, list: [], triggerAudio: false };
            render();
        });

        function render() {
            document.getElementById('nomor-aktif').innerText = currentData.aktif ? currentData.aktif.nomor : "-";
            document.getElementById('poli-aktif').innerText = currentData.aktif ? `Poli: ${currentData.aktif.poli}` : "-";

            const listContainer = document.getElementById('list-loket');
            if (!currentData.list || currentData.list.length === 0) {
                listContainer.innerHTML = `<p class="text-xs text-slate-400 text-center py-8">Tidak ada antrean</p>`;
                return;
            }

            listContainer.innerHTML = currentData.list.map((item) => `
                <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <span class="font-bold text-slate-700">${item.nomor}</span>
                    <span class="text-xs bg-slate-200 text-slate-600 px-2 py-1 rounded">${item.poli}</span>
                </div>
            `).join('');
        }

        window.panggilBerikutnya = async function() {
            if (!currentData.list || currentData.list.length === 0) {
                alert("Daftar antrean kosong.");
                return;
            }
            const berikutnya = currentData.list.shift();
            currentData.aktif = berikutnya;
            currentData.triggerAudio = true;

            await set(ref(db, 'antrianData'), currentData);
        };

        window.panggilUlang = async function() {
            if (!currentData.aktif || currentData.aktif.nomor === "-") {
                alert("Belum ada antrean yang dipanggil.");
                return;
            }
            currentData.triggerAudio = true;
            await set(ref(db, 'antrianData'), currentData);
        };

        window.resetAntrian = async function() {
            if (confirm("Yakin ingin mereset seluruh antrean hari ini?")) {
                await set(ref(db, 'antrianData'), {
                    aktif: { nomor: "-", poli: "-" },
                    list: [],
                    triggerAudio: false
                });
            }
        };
    </script>
</body>
</html>
