<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Panel Petugas - UPT Puskesmas Tongguh</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 h-screen flex flex-col font-sans">
    
    <header class="bg-emerald-600 text-white py-4 px-8 shadow flex justify-between items-center">
        <h1 class="text-xl font-bold">Panel Pemanggilan Petugas - Pendaftaran</h1>
        <span id="sisa-antrian-badge" class="bg-emerald-700 px-3 py-1 rounded text-sm font-medium">Sisa: 0 Pasien</span>
    </header>

    <main class="flex-1 p-8 max-w-lg mx-auto w-full flex flex-col justify-center space-y-6">
        <div class="bg-white rounded-2xl shadow-xl p-8 border border-slate-200 text-center space-y-4">
            <h2 class="text-slate-500 font-medium text-base">Nomor Sedang Dipanggil</h2>
            <div id="current-called" class="text-7xl font-black text-emerald-600">-</div>
            <div id="current-poli" class="text-sm font-bold text-slate-600 bg-slate-100 py-2 rounded-lg">Menunggu Pemanggilan</div>
            
            <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="panggilNext()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl shadow-lg transition text-base">
                    Panggil Berikutnya
                </button>
                <button onclick="panggilUlang()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold py-4 rounded-xl shadow-lg transition text-base">
                    Panggil Ulang
                </button>
            </div>
        </div>
    </main>

    <script>
        let nomorTerakhir = "-";
        let poliTerakhir = "-";

        function updateSisaUI(list) {
            document.getElementById('sisa-antrian-badge').innerText = `Sisa: ${list ? list.length : 0} Pasien`;
        }

        window.addEventListener('storage', (e) => {
            if (e.key === 'antrianData') {
                let db = JSON.parse(e.newValue);
                updateSisaUI(db.list);
            }
        });

        let dbAwal = JSON.parse(localStorage.getItem('antrianData')) || { list: [] };
        updateSisaUI(dbAwal.list);

        function panggilNext() {
            let database = JSON.parse(localStorage.getItem('antrianData')) || { list: [] };
            if (!database.list || database.list.length === 0) {
                alert("Tidak ada antrean tersisa!");
                return;
            }

            let dipanggil = database.list.shift();
            nomorTerakhir = dipanggil.nomor;
            poliTerakhir = dipanggil.poli;

            database.aktif = {
                nomor: dipanggil.nomor,
                loket: "Pendaftaran",
                poli: dipanggil.poli,
                time: Date.now() // Penanda agar trigger suara selalu aktif
            };
            database.triggerAudio = true;

            document.getElementById('current-called').innerText = dipanggil.nomor;
            document.getElementById('current-poli',).innerText = `Poli: ${dipanggil.poli}`;

            localStorage.setItem('antrianData', JSON.stringify(database));
            updateSisaUI(database.list);
        }

        function panggilUlang() {
            if (nomorTerakhir === "-") {
                alert("Belum ada nomor yang dipanggil!");
                return;
            }

            let database = JSON.parse(localStorage.getItem('antrianData')) || {};
            database.aktif = {
                nomor: nomorTerakhir,
                loket: "Pendaftaran",
                poli: poliTerakhir,
                time: Date.now() // Penanda waktu baru agar suara panggil ulang pasti bunyi
            };
            database.triggerAudio = true;

            localStorage.setItem('antrianData', JSON.stringify(database));
        }
    </script>
</body>
</html>
