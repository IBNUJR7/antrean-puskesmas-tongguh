<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Cetak 30 Nomor Antrean A4 - UPT Puskesmas Tongguh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Pengaturan Cetak Pas 1 Lembar A4 untuk 30 Tiket */
        @media print {
            body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .no-print {
                display: none !important;
            }
            .page-container {
                display: grid !important;
                grid-template-columns: repeat(5, 1fr); /* 5 kolom */
                grid-template-rows: repeat(6, 1fr);   /* 6 baris (total 30 kotak) */
                gap: 3mm;
                width: 100vw;
                height: 100vh;
                padding: 5mm;
                box-sizing: border-box;
            }
            .ticket-box {
                border: 1px dashed #64748b !important;
                box-sizing: border-box;
                padding: 2mm !important;
                page-break-inside: avoid;
                background: white;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                text-align: center;
            }
            @page {
                size: A4 portrait;
                margin: 0;
            }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-6 font-sans">

    <!-- Panel Kontrol (Hanya tampil di layar, hilang saat diprint) -->
    <div class="no-print max-w-xl mx-auto bg-white rounded-2xl shadow-xl p-6 mb-8 border border-slate-200 space-y-4">
        <h1 class="text-xl font-bold text-slate-800 text-center">Cetak 30 Nomor Antrean (1 Lembar A4)</h1>
        <p class="text-xs text-slate-500 text-center">Format universal TGH-001 s.d TGH-030. Otomatis pas rapi 5x6 kotak dalam 1 halaman A4.</p>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Mulai Dari Nomor (Start):</label>
                <input type="number" id="input-mulai" value="1" min="1" class="w-full border rounded-xl p-2.5 text-sm bg-slate-50 font-semibold">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Jumlah Tiket:</label>
                <input type="number" id="input-jumlah" value="30" readonly class="w-full border rounded-xl p-2.5 text-sm bg-slate-200 font-semibold text-slate-600 cursor-not-allowed" title="Dikunci pas 30 nomor per lembar">
            </div>
        </div>

        <div class="flex gap-3 pt-2">
            <button onclick="generateTiket()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow transition text-sm">
                Perbarui Nomor
            </button>
            <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-3 rounded-xl shadow transition text-sm">
                🖨️ Cetak ke A4
            </button>
        </div>
    </div>

    <!-- Area Lembar Cetak A4 -->
    <div id="print-area" class="page-container max-w-4xl mx-auto grid grid-cols-5 gap-3 bg-white p-6 rounded-2xl shadow">
        <!-- Tiket akan digenerate otomatis di sini -->
    </div>

    <script>
        function generateTiket() {
            let mulai = parseInt(document.getElementById('input-mulai').value) || 1;
            let jumlah = 30; // Dikunci pas 30 nomor
            let container = document.getElementById('print-area');
            
            let htmlContent = '';
            let tanggalHariIni = new Date().toLocaleDateString('id-ID', { dateStyle: 'short' });

            for (let i = 0; i < jumlah; i++) {
                let nomorUrut = mulai + i;
                let nomorStr = `TGH-${String(nomorUrut).padStart(3, '0')}`;
                
                htmlContent += `
                    <div class="ticket-box bg-white border-2 border-dashed border-slate-400 rounded-lg p-2 flex flex-col justify-between text-center font-mono shadow-sm">
                        <div>
                            <div style="font-size: 8px; font-weight: bold; line-height: 1.1; color: #0f172a;">UPT PUSKESMAS TONGGUH</div>
                            <div style="border-bottom: 1px dashed #94a3b8; margin: 2px 0;"></div>
                            
                            <div style="font-size: 7px; color: #334155;">NOMOR ANTREAN</div>
                            <div style="font-size: 20px; font-weight: 900; line-height: 1.1; margin: 2px 0; color: #047857;">${nomorStr}</div>
                            <div style="font-size: 7px; font-weight: bold; color: #1e293b;">PENDAFTARAN</div>
                        </div>

                        <div>
                            <div style="border-bottom: 1px dashed #94a3b8; margin: 2px 0;"></div>
                            <div style="font-size: 6px; color: #64748b;">${tanggalHariIni} | Harap Bawa</div>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = htmlContent;
        }

        // Generate otomatis saat pertama kali dibuka
        window.onload = function() {
            generateTiket();
        };
    </script>
</body>
</html>
